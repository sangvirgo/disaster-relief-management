<text x="48" y="766" class="note">Ký hiệu: PK khóa chính · FK khóa ngoại SQL · FK? nullable · UK duy nhất · UK* thuộc khóa duy nhất tổ hợp · REF ID tham chiếu không có FK</text>
<text x="48" y="786" class="note">FK? là khóa ngoại nullable. FK đồng thời là PK/UK giới hạn quan hệ tối đa một bản ghi; FK thường cho phép nhiều bản ghi con. Ô xám là bảng cùng service ở trang khác.</text>
<text x="48" y="806" class="note">Role và permission là danh mục mã cố định trong ứng dụng, không phải bảng SQL. campaign_id trong role_grant là ID tham chiếu sang Response, không có khóa ngoại liên service.</text>
</svg>
