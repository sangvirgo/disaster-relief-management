name: c48

services:
  postgres:
    image: postgis/postgis:17-3.5@sha256:01a6a70e41e6c4467c8f55f6063555ed72db2d6662cd0d571040d42eadaeb6f6
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: '${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in backend/.env}'
    command: ["postgres", "-c", "max_connections=${POSTGRES_MAX_CONNECTIONS:-140}", "-c", "shared_buffers=${POSTGRES_SHARED_BUFFERS:-256MB}"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../../docs/backend/schema:/schema:ro
    ports:
      - '127.0.0.1:${POSTGRES_HOST_PORT:-55432}:5432'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [c48-internal]

  db-init:
    image: postgis/postgis:17-3.5@sha256:01a6a70e41e6c4467c8f55f6063555ed72db2d6662cd0d571040d42eadaeb6f6
    entrypoint: ["/bin/bash", "/init.sh"]
    environment:
      POSTGRES_PASSWORD: '${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in backend/.env}'
      IDENTITY_MIGRATOR_PASSWORD: '${IDENTITY_MIGRATOR_PASSWORD:?Set IDENTITY_MIGRATOR_PASSWORD in backend/.env}'
      IDENTITY_APP_PASSWORD: '${IDENTITY_APP_PASSWORD:?Set IDENTITY_APP_PASSWORD in backend/.env}'
      RESPONSE_MIGRATOR_PASSWORD: '${RESPONSE_MIGRATOR_PASSWORD:?Set RESPONSE_MIGRATOR_PASSWORD in backend/.env}'
      RESPONSE_APP_PASSWORD: '${RESPONSE_APP_PASSWORD:?Set RESPONSE_APP_PASSWORD in backend/.env}'
      LOGISTICS_MIGRATOR_PASSWORD: '${LOGISTICS_MIGRATOR_PASSWORD:?Set LOGISTICS_MIGRATOR_PASSWORD in backend/.env}'
      LOGISTICS_APP_PASSWORD: '${LOGISTICS_APP_PASSWORD:?Set LOGISTICS_APP_PASSWORD in backend/.env}'
    volumes:
      - ./db-init/init.sh:/init.sh:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks: [c48-internal]

  identity-migrate:
    image: c48/identity-api:local
    build:
      context: ../..
      dockerfile: backend/apps/identity/Dockerfile
    environment:
      NODE_ENV: '${NODE_ENV:-development}'
      DATABASE_URL: 'postgresql://identity_migrator:${IDENTITY_MIGRATOR_PASSWORD}@postgres:5432/c48_identity'
      DB_POOL_MAX: "2"
      DB_LOCK_TIMEOUT_MS: "3000"
      DB_STATEMENT_TIMEOUT_MS: "8000"
      LOG_LEVEL: '${LOG_LEVEL:-info}'
      C48_SCHEMA_DIR: /workspace/backend/schema
    command: ["node", "dist/apps/identity/src/database/migrate.js"]
    depends_on:
      db-init:
        condition: service_completed_successfully
    restart: "no"
    networks: [c48-internal]

  response-migrate:
    image: c48/response-api:local
    build:
      context: ../..
      dockerfile: backend/apps/response/Dockerfile
    environment:
      NODE_ENV: '${NODE_ENV:-development}'
      DATABASE_URL: 'postgresql://response_migrator:${RESPONSE_MIGRATOR_PASSWORD}@postgres:5432/c48_response'
      DB_POOL_MAX: "2"
      DB_LOCK_TIMEOUT_MS: "3000"
      DB_STATEMENT_TIMEOUT_MS: "8000"
      LOG_LEVEL: '${LOG_LEVEL:-info}'
      C48_SCHEMA_DIR: /workspace/backend/schema
    command: ["node", "dist/apps/response/src/database/migrate.js"]
    depends_on:
      db-init:
        condition: service_completed_successfully
    restart: "no"
    networks: [c48-internal]

  logistics-migrate:
    image: c48/logistics-api:local
    build:
      context: ../..
      dockerfile: backend/apps/logistics/Dockerfile
    environment:
      NODE_ENV: '${NODE_ENV:-development}'
      DATABASE_URL: 'postgresql://logistics_migrator:${LOGISTICS_MIGRATOR_PASSWORD}@postgres:5432/c48_logistics'
      DB_POOL_MAX: "2"
      DB_LOCK_TIMEOUT_MS: "3000"
      DB_STATEMENT_TIMEOUT_MS: "8000"
      LOG_LEVEL: '${LOG_LEVEL:-info}'
      C48_SCHEMA_DIR: /workspace/backend/schema
    command: ["node", "dist/apps/logistics/src/database/migrate.js"]
    depends_on:
      db-init:
        condition: service_completed_successfully
    restart: "no"
    networks: [c48-internal]

  identity-api:
    image: c48/identity-api:local
    build:
      context: ../..
      dockerfile: backend/apps/identity/Dockerfile
    environment:
      NODE_ENV: '${NODE_ENV:-development}'
      PORT: "3001"
      DATABASE_URL: 'postgresql://identity_app_login:${IDENTITY_APP_PASSWORD}@postgres:5432/c48_identity'
      DB_POOL_MAX: '${IDENTITY_DB_POOL_MAX:-20}'
      DB_LOCK_TIMEOUT_MS: "3000"
      DB_STATEMENT_TIMEOUT_MS: "8000"
      LOG_LEVEL: '${LOG_LEVEL:-info}'
      C48_SCHEMA_DIR: /workspace/backend/schema
      JWT_ISSUER: '${JWT_ISSUER:?Set JWT_ISSUER in backend/.env}'
      JWT_AUDIENCE: '${JWT_AUDIENCE:?Set JWT_AUDIENCE in backend/.env}'
      JWT_PRIVATE_KEY: '${JWT_PRIVATE_KEY:?Set JWT_PRIVATE_KEY in backend/.env}'
      JWT_PUBLIC_KEY: '${JWT_PUBLIC_KEY:?Set JWT_PUBLIC_KEY in backend/.env}'
      WEB_ALLOWED_ORIGINS: '${WEB_ALLOWED_ORIGINS:?Set WEB_ALLOWED_ORIGINS in backend/.env}'
      SECRET_HASH_PEPPER_AUTH_V1: '${SECRET_HASH_PEPPER_AUTH_V1:?Set SECRET_HASH_PEPPER_AUTH_V1 in backend/.env}'
      SECRET_HASH_PEPPER_AUTH_CURRENT: '${SECRET_HASH_PEPPER_AUTH_CURRENT:-v1}'
      ARGON2_MEMORY_KIB: '${ARGON2_MEMORY_KIB:-65536}'
      ARGON2_TIME_COST: '${ARGON2_TIME_COST:-3}'
      ARGON2_PARALLELISM: '${ARGON2_PARALLELISM:-1}'
      ARGON2_MAX_CONCURRENCY: '${ARGON2_MAX_CONCURRENCY:-}'
      IDENTITY_SERVICE_CLIENT_ID: '${IDENTITY_SERVICE_CLIENT_ID:?Set IDENTITY_SERVICE_CLIENT_ID in backend/.env}'
      IDENTITY_SERVICE_CLIENT_SECRET: '${IDENTITY_SERVICE_CLIENT_SECRET:?Set IDENTITY_SERVICE_CLIENT_SECRET in backend/.env}'
      RESPONSE_SERVICE_CLIENT_ID: '${RESPONSE_SERVICE_CLIENT_ID:?Set RESPONSE_SERVICE_CLIENT_ID in backend/.env}'
      RESPONSE_SERVICE_CLIENT_SECRET: '${RESPONSE_SERVICE_CLIENT_SECRET:?Set RESPONSE_SERVICE_CLIENT_SECRET in backend/.env}'
      LOGISTICS_SERVICE_CLIENT_ID: '${LOGISTICS_SERVICE_CLIENT_ID:?Set LOGISTICS_SERVICE_CLIENT_ID in backend/.env}'
      LOGISTICS_SERVICE_CLIENT_SECRET: '${LOGISTICS_SERVICE_CLIENT_SECRET:?Set LOGISTICS_SERVICE_CLIENT_SECRET in backend/.env}'
      RESPONSE_BASE_URL: http://response-api:3002
    ports:
      - '127.0.0.1:3001:3001'
    depends_on:
      identity-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health/ready').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    networks: [c48-internal]

  response-api:
    image: c48/response-api:local
    build:
      context: ../..
      dockerfile: backend/apps/response/Dockerfile
    environment:
      NODE_ENV: '${NODE_ENV:-development}'
      PORT: "3002"
      DATABASE_URL: 'postgresql://response_app_login:${RESPONSE_APP_PASSWORD}@postgres:5432/c48_response'
      DB_POOL_MAX: '${RESPONSE_DB_POOL_MAX:-30}'
      DB_LOCK_TIMEOUT_MS: "3000"
      DB_STATEMENT_TIMEOUT_MS: "8000"
      LOG_LEVEL: '${LOG_LEVEL:-info}'
      C48_SCHEMA_DIR: /workspace/backend/schema
      JWT_ISSUER: '${JWT_ISSUER:?Set JWT_ISSUER in backend/.env}'
      JWT_AUDIENCE: '${JWT_AUDIENCE:?Set JWT_AUDIENCE in backend/.env}'
      JWT_PUBLIC_KEY: '${JWT_PUBLIC_KEY:?Set JWT_PUBLIC_KEY in backend/.env}'
      WEB_ALLOWED_ORIGINS: '${WEB_ALLOWED_ORIGINS:?Set WEB_ALLOWED_ORIGINS in backend/.env}'
      RESPONSE_SERVICE_CLIENT_ID: '${RESPONSE_SERVICE_CLIENT_ID:?Set RESPONSE_SERVICE_CLIENT_ID in backend/.env}'
      RESPONSE_SERVICE_CLIENT_SECRET: '${RESPONSE_SERVICE_CLIENT_SECRET:?Set RESPONSE_SERVICE_CLIENT_SECRET in backend/.env}'
      IDENTITY_BASE_URL: http://identity-api:3001
      LOGISTICS_BASE_URL: http://logistics-api:3003
      SECRET_HASH_PEPPER_SOS: '${SECRET_HASH_PEPPER_SOS:?Set SECRET_HASH_PEPPER_SOS in backend/.env}'
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: '${S3_PUBLIC_ENDPOINT:?Set S3_PUBLIC_ENDPOINT in backend/.env}'
      S3_BUCKET: c48-response-evidence
      S3_ACCESS_KEY: '${S3_RESPONSE_ACCESS_KEY:?Set S3_RESPONSE_ACCESS_KEY in backend/.env}'
      S3_SECRET_KEY: '${S3_RESPONSE_SECRET_KEY:?Set S3_RESPONSE_SECRET_KEY in backend/.env}'
      SOS_SOFT_LIMIT_PER_IP: '${SOS_SOFT_LIMIT_PER_IP:-30}'
      SOS_HARD_LIMIT_PER_IP: '${SOS_HARD_LIMIT_PER_IP:-300}'
      SOS_GLOBAL_PER_MIN: '${SOS_GLOBAL_PER_MIN:-300}'
      PROXY_OPEN_CAP: '${PROXY_OPEN_CAP:-3}'
      PROXY_DAILY_SOFT_LIMIT: '${PROXY_DAILY_SOFT_LIMIT:-10}'
      VERIFY_OVERDUE_MINUTES: '${VERIFY_OVERDUE_MINUTES:-15}'
      OFFER_OVERDUE_MINUTES: '${OFFER_OVERDUE_MINUTES:-10}'
      TEAM_POSITION_FRESH_MINUTES: '${TEAM_POSITION_FRESH_MINUTES:-30}'
      TEAM_SEARCH_RADIUS_M: '${TEAM_SEARCH_RADIUS_M:-10000}'
      TEAM_BAND_TOLERANCE_M: '${TEAM_BAND_TOLERANCE_M:-2000}'
      TEAM_BAND_TOLERANCE_P2_M: '${TEAM_BAND_TOLERANCE_P2_M:-500}'
      TEAM_BAND_TOLERANCE_P1_M: '${TEAM_BAND_TOLERANCE_P1_M:-0}'
      SIGNED_URL_TTL_S: '${SIGNED_URL_TTL_S:-60}'
      SCHEDULER_ENABLED: '${SCHEDULER_ENABLED:-false}'
      INTROSPECT_TIMEOUT_MS: '${INTROSPECT_TIMEOUT_MS:-500}'
      DEMO_INTAKE_ORGANIZATION_ID: '${DEMO_INTAKE_ORGANIZATION_ID:?Set DEMO_INTAKE_ORGANIZATION_ID in backend/.env}'
    ports:
      - '127.0.0.1:3002:3002'
    depends_on:
      response-migrate:
        condition: service_completed_successfully
      minio:
        condition: service_healthy
        required: false
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3002/health/ready').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    networks: [c48-internal]

  logistics-api:
    image: c48/logistics-api:local
    build:
      context: ../..
      dockerfile: backend/apps/logistics/Dockerfile
    environment:
      NODE_ENV: '${NODE_ENV:-development}'
      PORT: "3003"
      DATABASE_URL: 'postgresql://logistics_app_login:${LOGISTICS_APP_PASSWORD}@postgres:5432/c48_logistics'
      DB_POOL_MAX: '${LOGISTICS_DB_POOL_MAX:-20}'
      DB_LOCK_TIMEOUT_MS: "3000"
      DB_STATEMENT_TIMEOUT_MS: "8000"
      LOG_LEVEL: '${LOG_LEVEL:-info}'
      C48_SCHEMA_DIR: /workspace/backend/schema
      JWT_ISSUER: '${JWT_ISSUER:?Set JWT_ISSUER in backend/.env}'
      JWT_AUDIENCE: '${JWT_AUDIENCE:?Set JWT_AUDIENCE in backend/.env}'
      JWT_PUBLIC_KEY: '${JWT_PUBLIC_KEY:?Set JWT_PUBLIC_KEY in backend/.env}'
      WEB_ALLOWED_ORIGINS: '${WEB_ALLOWED_ORIGINS:?Set WEB_ALLOWED_ORIGINS in backend/.env}'
      LOGISTICS_SERVICE_CLIENT_ID: '${LOGISTICS_SERVICE_CLIENT_ID:?Set LOGISTICS_SERVICE_CLIENT_ID in backend/.env}'
      LOGISTICS_SERVICE_CLIENT_SECRET: '${LOGISTICS_SERVICE_CLIENT_SECRET:?Set LOGISTICS_SERVICE_CLIENT_SECRET in backend/.env}'
      IDENTITY_BASE_URL: http://identity-api:3001
      RESPONSE_BASE_URL: http://response-api:3002
      SECRET_HASH_PEPPER_DONATION: '${SECRET_HASH_PEPPER_DONATION:?Set SECRET_HASH_PEPPER_DONATION in backend/.env}'
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: c48-logistics-evidence
      S3_ACCESS_KEY: '${S3_LOGISTICS_ACCESS_KEY:?Set S3_LOGISTICS_ACCESS_KEY in backend/.env}'
      S3_SECRET_KEY: '${S3_LOGISTICS_SECRET_KEY:?Set S3_LOGISTICS_SECRET_KEY in backend/.env}'
      SCHEDULER_ENABLED: '${SCHEDULER_ENABLED:-false}'
      INTROSPECT_TIMEOUT_MS: '${INTROSPECT_TIMEOUT_MS:-500}'
    ports:
      - '127.0.0.1:3003:3003'
    depends_on:
      logistics-migrate:
        condition: service_completed_successfully
      minio:
        condition: service_healthy
        required: false
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3003/health/ready').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    networks: [c48-internal]

  nginx:
    image: nginx:1.30.5
    environment:
      SOS_SOFT_LIMIT_PER_IP: '${SOS_SOFT_LIMIT_PER_IP:-30}'
      SOS_HARD_LIMIT_PER_IP: '${SOS_HARD_LIMIT_PER_IP:-300}'
      NGINX_ENVSUBST_FILTER: '^SOS_(SOFT_LIMIT_PER_IP|HARD_LIMIT_PER_IP|HARD_BURST_PER_IP)$'
    ports:
      - '127.0.0.1:${PUBLIC_PORT:-8080}:80'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/proxy-common.conf:/etc/nginx/proxy-common.conf:ro
      - ./nginx/sos-limits-zone.conf.template:/etc/nginx/templates/sos-limits-zone.conf.template:ro
      - ./nginx/sos-limits-location.conf.template:/etc/nginx/templates/sos-limits-location.conf.template:ro
      - ./nginx/15-sos-burst.envsh:/docker-entrypoint.d/15-sos-burst.envsh:ro
    depends_on:
      identity-api:
        condition: service_healthy
      response-api:
        condition: service_healthy
      logistics-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "nginx -t"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks: [c48-internal]

  minio:
    image: quay.io/minio/aistor/minio:RELEASE.2026-09-19T17-05-25Z
    profiles: [storage]
    command: ["minio", "server", "/mnt/data", "--console-address", ":9001", "--license", "/minio.license"]
    environment:
      MINIO_ROOT_USER: '${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in backend/.env}'
      MINIO_ROOT_PASSWORD: '${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in backend/.env}'
    volumes:
      - minio-data:/mnt/data
      - type: bind
        source: '${AISTOR_LICENSE_PATH:-/absolute/path/to/minio.license}'
        target: /minio.license
        read_only: true
        bind:
          create_host_path: false
    ports:
      - "127.0.0.1:9001:9001"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/minio/health/ready >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 30
    networks: [c48-internal]

  minio-init:
    image: quay.io/minio/aistor/mc:RELEASE.2026-09-19T15-24-59Z
    profiles: [storage]
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        until mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" >/dev/null 2>&1 && mc ready local >/dev/null 2>&1; do sleep 2; done
        mc mb --ignore-existing local/c48-response-evidence
        mc mb --ignore-existing local/c48-logistics-evidence
        mc admin user info local "$$S3_RESPONSE_ACCESS_KEY" >/dev/null 2>&1 || mc admin user add local "$$S3_RESPONSE_ACCESS_KEY" "$$S3_RESPONSE_SECRET_KEY"
        mc admin user info local "$$S3_LOGISTICS_ACCESS_KEY" >/dev/null 2>&1 || mc admin user add local "$$S3_LOGISTICS_ACCESS_KEY" "$$S3_LOGISTICS_SECRET_KEY"
        mc admin policy info local c48-response-evidence >/dev/null 2>&1 || mc admin policy create local c48-response-evidence /policies/response-policy.json
        mc admin policy info local c48-logistics-evidence >/dev/null 2>&1 || mc admin policy create local c48-logistics-evidence /policies/logistics-policy.json
        mc admin policy attach local c48-response-evidence --user "$$S3_RESPONSE_ACCESS_KEY"
        mc admin policy attach local c48-logistics-evidence --user "$$S3_LOGISTICS_ACCESS_KEY"
    environment:
      MINIO_ROOT_USER: '${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in backend/.env}'
      MINIO_ROOT_PASSWORD: '${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in backend/.env}'
      S3_RESPONSE_ACCESS_KEY: '${S3_RESPONSE_ACCESS_KEY:?Set S3_RESPONSE_ACCESS_KEY in backend/.env}'
      S3_RESPONSE_SECRET_KEY: '${S3_RESPONSE_SECRET_KEY:?Set S3_RESPONSE_SECRET_KEY in backend/.env}'
      S3_LOGISTICS_ACCESS_KEY: '${S3_LOGISTICS_ACCESS_KEY:?Set S3_LOGISTICS_ACCESS_KEY in backend/.env}'
      S3_LOGISTICS_SECRET_KEY: '${S3_LOGISTICS_SECRET_KEY:?Set S3_LOGISTICS_SECRET_KEY in backend/.env}'
    volumes:
      - ./minio/response-policy.json:/policies/response-policy.json:ro
      - ./minio/logistics-policy.json:/policies/logistics-policy.json:ro
    depends_on:
      minio:
        condition: service_healthy
    networks: [c48-internal]

  seed:
    image: c48/identity-api:local
    build:
      context: ../..
      dockerfile: backend/apps/identity/Dockerfile
    profiles: [seed]
    environment:
      NODE_ENV: '${NODE_ENV:-development}'
      PGHOST: postgres
      PGPORT: "5432"
      IDENTITY_MIGRATOR_PASSWORD: '${IDENTITY_MIGRATOR_PASSWORD:?Set IDENTITY_MIGRATOR_PASSWORD in backend/.env}'
      RESPONSE_MIGRATOR_PASSWORD: '${RESPONSE_MIGRATOR_PASSWORD:?Set RESPONSE_MIGRATOR_PASSWORD in backend/.env}'
      LOGISTICS_MIGRATOR_PASSWORD: '${LOGISTICS_MIGRATOR_PASSWORD:?Set LOGISTICS_MIGRATOR_PASSWORD in backend/.env}'
      SEED_PASSWORD: '${SEED_PASSWORD:?Set SEED_PASSWORD in backend/.env}'
      ARGON2_MEMORY_KIB: '${ARGON2_MEMORY_KIB:-65536}'
      ARGON2_TIME_COST: '${ARGON2_TIME_COST:-3}'
      ARGON2_PARALLELISM: '${ARGON2_PARALLELISM:-1}'
    command: ["node", "scripts/db/seed.mjs"]
    depends_on:
      identity-migrate:
        condition: service_completed_successfully
      response-migrate:
        condition: service_completed_successfully
      logistics-migrate:
        condition: service_completed_successfully
    networks: [c48-internal]

volumes:
  pgdata:
  minio-data:

networks:
  c48-internal:
    name: c48-internal
    driver: bridge
