proxy_pass_request_headers off;
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Correlation-Id $http_x_correlation_id;
proxy_set_header Authorization $http_authorization;
proxy_set_header Cookie $http_cookie;
proxy_set_header Origin $http_origin;
proxy_set_header X-CSRF-Token $http_x_csrf_token;
proxy_set_header Idempotency-Key $http_idempotency_key;
proxy_set_header X-Tracking-Secret $http_x_tracking_secret;
proxy_set_header X-Tracking-Code $http_x_tracking_code;
proxy_set_header X-Donation-Secret $http_x_donation_secret;
proxy_set_header X-Recovery-Code $http_x_recovery_code;
proxy_set_header Content-Type $content_type;
proxy_set_header Content-Length $content_length;
proxy_set_header Accept $http_accept;
proxy_set_header User-Agent $http_user_agent;
