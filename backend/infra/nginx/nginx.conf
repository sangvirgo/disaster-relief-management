worker_processes auto;
pid /var/run/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server_tokens off;
  sendfile on;
  keepalive_timeout 65s;

  log_format privacy '[$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent';
  access_log /var/log/nginx/access.log privacy;

  # Real client IP behind the Cloudflare Tunnel. cloudflared runs on the host and reaches this container through
  # the published loopback port, so nginx sees the Docker bridge gateway (172.16.0.0/12) as the peer. Only that
  # hop (and loopback) may set the client address through CF-Connecting-IP; a header from any other peer is
  # ignored. Without the header (local development) $remote_addr stays the TCP peer. Every limit_req/limit_conn
  # zone below and the X-Forwarded-For header in proxy-common.conf then use the real client IP.
  set_real_ip_from 172.16.0.0/12;
  set_real_ip_from 127.0.0.1;
  real_ip_header CF-Connecting-IP;

  # One throttling key per client: an IPv4 address stays exact (carrier-grade NAT and shelter Wi-Fi put many people
  # behind one address), an IPv6 address is grouped by its /64 (one subscriber controls the whole /64). The APIs use
  # the same rule (clientRateKey). An IPv6 address written with "::" inside its first four groups keeps its exact
  # value, which only makes that client's key narrower.
  map $remote_addr $client_rate_key {
    "~^(?<client_prefix64>[0-9A-Fa-f]{1,4}:[0-9A-Fa-f]{1,4}:[0-9A-Fa-f]{1,4}:[0-9A-Fa-f]{1,4}):" "$client_prefix64::/64";
    default $remote_addr;
  }

  include /etc/nginx/conf.d/sos-limits-zone.conf;

  # Identity enforces the exact per-username+client and per-client login limits; Nginx smooths same-client bursts.
  limit_req_zone $client_rate_key zone=login_per_ip:10m rate=30r/m;
  # Identity enforces the exact 20/hour per-client and 3/hour per-email registration quotas; this is a burst guard.
  limit_req_zone $client_rate_key zone=register_per_ip:10m rate=10r/m;
  # Response enforces exact 30/min and 300/hour tracking-read quotas across both routes.
  # Password-reset requests are additionally capped by Identity per client and opaque email fingerprint.
  limit_req_zone $client_rate_key zone=password_reset_per_ip:10m rate=5r/m;
  limit_req_zone $client_rate_key zone=password_reset_confirm_per_ip:10m rate=10r/m;
  # These Nginx buckets are additional edge burst guards, not the hourly quota source of truth.
  limit_req_zone $client_rate_key zone=tracking_per_ip:10m rate=30r/m;
  limit_req_zone $client_rate_key zone=donation_delivery_per_ip:10m rate=10r/m;
  limit_req_zone $client_rate_key zone=donation_lookup_per_ip:10m rate=30r/m;
  limit_req_zone $client_rate_key zone=tracking_hourly_per_ip:10m rate=5r/m;
  limit_conn_zone $client_rate_key zone=upload_concurrent_per_ip:10m;

  # Docker replaces service IPs during recreate; refresh without reloading the ingress.
  resolver 127.0.0.11 valid=5s ipv6=off;

  upstream identity_api {
    zone identity_api 64k;
    server identity-api:3001 resolve;
    keepalive 64;
  }

  upstream response_api {
    zone response_api 64k;
    server response-api:3002 resolve;
    keepalive 64;
  }

  upstream logistics_api {
    zone logistics_api 64k;
    server logistics-api:3003 resolve;
    keepalive 64;
  }

  upstream web_app {
    zone web_app 64k;
    server web:80 resolve;
    keepalive 32;
  }

  server {
    listen 80;
    server_name _;
    client_max_body_size 1m;
    client_body_timeout 30s;
    limit_req_status 429;
    limit_conn_status 429;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; script-src 'self' https://accounts.google.com/gsi/client https://maps.googleapis.com https://maps.gstatic.com; style-src 'self' 'unsafe-inline' https://accounts.google.com/gsi/style https://fonts.googleapis.com; img-src 'self' data: blob: https://maps.gstatic.com https://*.googleapis.com https://*.gstatic.com https://tiles.openfreemap.org https://tilecache.rainviewer.com https://gibs.earthdata.nasa.gov https://s3.ap-southeast-2.amazonaws.com; media-src 'self' blob: https://s3.ap-southeast-2.amazonaws.com; connect-src 'self' https://accounts.google.com/gsi/ https://maps.googleapis.com https://maps.gstatic.com https://tiles.openfreemap.org https://geocode.arcgis.com https://nominatim.openstreetmap.org https://api.rainviewer.com https://api.open-meteo.com https://www.gdacs.org; frame-src 'self' https://accounts.google.com/gsi/ https://www.google.com/maps/; font-src 'self' data: https://fonts.gstatic.com; frame-ancestors 'none'" always;
    proxy_hide_header Server;
    proxy_hide_header X-Powered-By;

    error_page 413 = @payload_too_large;
    error_page 411 = @length_required;
    error_page 429 = @rate_limited;

    location @payload_too_large {
      default_type application/json;
      return 413 '{"code":"PAYLOAD_TOO_LARGE","message":"Tệp hoặc nội dung vượt quá giới hạn cho phép."}';
    }

    location @length_required {
      default_type application/json;
      return 411 '{"code":"LENGTH_REQUIRED","message":"Yêu cầu tải tệp phải có Content-Length."}';
    }

    location @rate_limited {
      default_type application/json;
      add_header Cache-Control no-store always;
      add_header Retry-After 60 always;
      add_header X-Correlation-Id $request_id always;
      add_header X-Content-Type-Options nosniff always;
      add_header Referrer-Policy no-referrer always;
      add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; script-src 'self' https://accounts.google.com/gsi/client https://maps.googleapis.com https://maps.gstatic.com; style-src 'self' 'unsafe-inline' https://accounts.google.com/gsi/style https://fonts.googleapis.com; img-src 'self' data: blob: https://maps.gstatic.com https://*.googleapis.com https://*.gstatic.com https://tiles.openfreemap.org https://tilecache.rainviewer.com https://gibs.earthdata.nasa.gov https://s3.ap-southeast-2.amazonaws.com; media-src 'self' blob: https://s3.ap-southeast-2.amazonaws.com; connect-src 'self' https://accounts.google.com/gsi/ https://maps.googleapis.com https://maps.gstatic.com https://tiles.openfreemap.org https://geocode.arcgis.com https://nominatim.openstreetmap.org https://api.rainviewer.com https://api.open-meteo.com https://www.gdacs.org; frame-src 'self' https://accounts.google.com/gsi/ https://www.google.com/maps/; font-src 'self' data: https://fonts.gstatic.com; frame-ancestors 'none'" always;
      return 429 '{"code":"RATE_LIMITED","message":"Bạn thao tác quá nhanh. Vui lòng thử lại sau. Nếu đang nguy hiểm, hãy gọi 113/114/115.","correlation_id":"$request_id"}';
    }

    location @sos_rate_ceiling {
      default_type application/json;
      add_header Cache-Control no-store always;
      add_header Retry-After 60 always;
      add_header X-Content-Type-Options nosniff always;
      add_header Referrer-Policy no-referrer always;
      add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; script-src 'self' https://accounts.google.com/gsi/client https://maps.googleapis.com https://maps.gstatic.com; style-src 'self' 'unsafe-inline' https://accounts.google.com/gsi/style https://fonts.googleapis.com; img-src 'self' data: blob: https://maps.gstatic.com https://*.googleapis.com https://*.gstatic.com https://tiles.openfreemap.org https://tilecache.rainviewer.com https://gibs.earthdata.nasa.gov https://s3.ap-southeast-2.amazonaws.com; media-src 'self' blob: https://s3.ap-southeast-2.amazonaws.com; connect-src 'self' https://accounts.google.com/gsi/ https://maps.googleapis.com https://maps.gstatic.com https://tiles.openfreemap.org https://geocode.arcgis.com https://nominatim.openstreetmap.org https://api.rainviewer.com https://api.open-meteo.com https://www.gdacs.org; frame-src 'self' https://accounts.google.com/gsi/ https://www.google.com/maps/; font-src 'self' data: https://fonts.gstatic.com; frame-ancestors 'none'" always;
      return 429 '{"code":"SOS_RATE_CEILING","message":"Hệ thống đang quá tải yêu cầu từ địa chỉ của bạn. Nếu đang nguy hiểm, hãy gọi 113/114/115 rồi thử lại sau.","correlation_id":"$request_id"}';
    }

    # Liveness for the external uptime check (https://<host>/health/live). Only this exact path is exposed; every
    # other /health and /internal path stays hidden. An exact match wins over the regular-expression block below.
    location = /health/live {
      access_log off;
      add_header Cache-Control no-store always;
      add_header X-Content-Type-Options nosniff always;
      include /etc/nginx/proxy-common.conf;
      proxy_pass http://identity_api;
    }

    # The APIs serve Prometheus metrics on /metrics inside the Docker network only; never from the Internet.
    location = /metrics {
      return 404;
    }

    location ~* /(?:internal|health)(?:/|$) {
      return 404;
    }

    location ~ ^/api/v1/identity/auth/login$ {
      limit_req zone=login_per_ip burst=29 nodelay;
      include /etc/nginx/proxy-common.conf;
      proxy_pass http://identity_api;
    }

    location ~ ^/api/v1/identity/auth/register$ {
      limit_req zone=register_per_ip burst=20 nodelay;
      include /etc/nginx/proxy-common.conf;
      proxy_pass http://identity_api;
    }

    location = /api/v1/identity/auth/password-reset/request {
      limit_req zone=password_reset_per_ip burst=5 nodelay;
      include /etc/nginx/proxy-common.conf;
      proxy_pass http://identity_api;
    }

    location = /api/v1/identity/auth/password-reset/confirm {
      limit_req zone=password_reset_confirm_per_ip burst=5 nodelay;
      include /etc/nginx/proxy-common.conf;
      proxy_pass http://identity_api;
    }

    location ~* ^/api/v1/response/requests/track/?$ {
      limit_req zone=tracking_per_ip burst=29 nodelay;
      limit_req zone=tracking_hourly_per_ip burst=299 nodelay;
      include /etc/nginx/proxy-common.conf;
      proxy_pass http://response_api;
    }

    location ~* ^/api/v1/response/requests/[^/]+/events/?$ {
      limit_req zone=tracking_per_ip burst=29 nodelay;
      limit_req zone=tracking_hourly_per_ip burst=299 nodelay;
      include /etc/nginx/proxy-common.conf;
      proxy_pass http://response_api;
    }

    location ~* ^/api/v1/logistics/public/donation-drives/[^/]+/deliveries/?$ {
      limit_req zone=donation_delivery_per_ip burst=9 nodelay;
      include /etc/nginx/proxy-common.conf;
      proxy_pass http://logistics_api;
    }

    # Guest batch lookup verifies many capability secrets per call; throttle probing at the edge.
    location ~* ^/api/v1/logistics/public/donations/lookup/?$ {
      limit_req zone=donation_lookup_per_ip burst=9 nodelay;
      include /etc/nginx/proxy-common.conf;
      proxy_pass http://logistics_api;
    }

    location ~ ^/api/v1/response/.*/evidence(?:/|$) {
      client_max_body_size 55m;
      if ($content_length = "") { return 411; }
      limit_conn upload_concurrent_per_ip 2;
      proxy_read_timeout 120s;
      include /etc/nginx/proxy-common.conf;
      proxy_pass http://response_api;
    }

    location ~* ^/api/v1/logistics/.*/evidence(?:/|$) {
      # shortcut: the guest hourly byte budget is process-local until shared storage is available.
      client_max_body_size 55m;
      if ($content_length = "") { return 411; }
      limit_conn upload_concurrent_per_ip 2;
      include /etc/nginx/proxy-common.conf;
      proxy_pass http://logistics_api;
    }

    location ~ ^/c48-(response|logistics)-evidence/ {
      # MinIO is optional outside the storage profile, so resolve its Docker DNS name on demand.
      resolver 127.0.0.11 valid=30s;
      set $minio_upstream minio:9000;
      proxy_buffering off;
      proxy_pass_request_headers off;
      proxy_hide_header Cache-Control;
      add_header Cache-Control no-store always;
      add_header X-Content-Type-Options nosniff always;
      add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; script-src 'self' https://accounts.google.com/gsi/client https://maps.googleapis.com https://maps.gstatic.com; style-src 'self' 'unsafe-inline' https://accounts.google.com/gsi/style https://fonts.googleapis.com; img-src 'self' data: blob: https://maps.gstatic.com https://*.googleapis.com https://*.gstatic.com https://tiles.openfreemap.org https://tilecache.rainviewer.com https://gibs.earthdata.nasa.gov https://s3.ap-southeast-2.amazonaws.com; media-src 'self' blob: https://s3.ap-southeast-2.amazonaws.com; connect-src 'self' https://accounts.google.com/gsi/ https://maps.googleapis.com https://maps.gstatic.com https://tiles.openfreemap.org https://geocode.arcgis.com https://nominatim.openstreetmap.org https://api.rainviewer.com https://api.open-meteo.com https://www.gdacs.org; frame-src 'self' https://accounts.google.com/gsi/ https://www.google.com/maps/; font-src 'self' data: https://fonts.gstatic.com; frame-ancestors 'none'" always;
      proxy_set_header Range $http_range;
      proxy_set_header If-Range $http_if_range;
      proxy_set_header Host $http_host;
      proxy_pass http://$minio_upstream;
    }

    location /api/v1/identity/ {
      include /etc/nginx/proxy-common.conf;
      proxy_pass http://identity_api;
    }

    location ~* ^/api/v1/response/requests(?:/proxy)?/?$ {
      error_page 429 = @sos_rate_ceiling;
      include /etc/nginx/conf.d/sos-limits-location.conf;
      include /etc/nginx/proxy-common.conf;
      proxy_pass http://response_api;
    }

    location /api/v1/response/ {
      include /etc/nginx/proxy-common.conf;
      proxy_pass http://response_api;
    }

    location /api/v1/logistics/ {
      include /etc/nginx/proxy-common.conf;
      proxy_pass http://logistics_api;
    }

    location / {
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_pass http://web_app;
    }
  }
}
