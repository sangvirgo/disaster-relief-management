worker_processes auto;
pid /var/run/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server_tokens off;
  sendfile on;
  keepalive_timeout 65s;

  log_format privacy '$remote_addr - [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent "$http_user_agent"';
  access_log /var/log/nginx/access.log privacy;
  include /etc/nginx/conf.d/sos-limits-zone.conf;

  # shortcut: zones use exact IPs; normalize to /24 and /56 before production abuse controls.
  limit_req_zone $binary_remote_addr zone=login_per_ip:10m rate=30r/m;
  # shortcut: login is per-IP only; add per-IP+username control in Identity without logging credentials.
  # shortcut: 1/min plus burst 2 approximates 3 registrations/hour; replace with an hourly counter.
  limit_req_zone $binary_remote_addr zone=register_per_ip:10m rate=1r/m;
  limit_req_zone $binary_remote_addr zone=tracking_per_ip:10m rate=10r/m;
  # shortcut: 1/min plus burst approximates hourly quotas; replace when service-side hourly counters exist.
  limit_req_zone $binary_remote_addr zone=tracking_hourly_per_ip:10m rate=1r/m;
  limit_conn_zone $binary_remote_addr zone=upload_concurrent_per_ip:10m;

  upstream identity_api {
    server identity-api:3001;
    keepalive 64;
  }

  upstream response_api {
    server response-api:3002;
    keepalive 64;
  }

  upstream logistics_api {
    server logistics-api:3003;
    keepalive 64;
  }

  server {
    listen 80;
    server_name _;
    client_max_body_size 1m;
    client_body_timeout 30s;
    limit_req_status 429;
    limit_conn_status 429;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; frame-ancestors 'none'" always;
    proxy_hide_header Server;
    proxy_hide_header X-Powered-By;

    error_page 413 = @payload_too_large;
    error_page 411 = @length_required;
    error_page 429 = @rate_limited;

    location @payload_too_large {
      default_type application/json;
      return 413 '{"code":"PAYLOAD_TOO_LARGE","message":"Tệp hoặc nội dung vượt quá giới hạn cho phép."}';
    }

    location @length_required {
      default_type application/json;
      return 411 '{"code":"LENGTH_REQUIRED","message":"Yêu cầu tải tệp phải có Content-Length."}';
    }

    location @rate_limited {
      default_type application/json;
      add_header Retry-After 60 always;
      add_header X-Content-Type-Options nosniff always;
      add_header Referrer-Policy no-referrer always;
      add_header Content-Security-Policy "default-src 'self'; frame-ancestors 'none'" always;
      return 429 '{"code":"RATE_LIMITED","message":"Bạn thao tác quá nhanh. Vui lòng thử lại sau. Nếu đang nguy hiểm, hãy gọi 113/114/115."}';
    }

    location @sos_rate_ceiling {
      default_type application/json;
      add_header Cache-Control no-store always;
      add_header Retry-After 60 always;
      add_header X-Content-Type-Options nosniff always;
      add_header Referrer-Policy no-referrer always;
      add_header Content-Security-Policy "default-src 'self'; frame-ancestors 'none'" always;
      return 429 '{"code":"SOS_RATE_CEILING","message":"Hệ thống đang quá tải yêu cầu từ địa chỉ của bạn. Nếu đang nguy hiểm, hãy gọi 113/114/115 rồi thử lại sau.","correlation_id":"$request_id"}';
    }

    location ~* /(?:internal|health)(?:/|$) {
      return 404;
    }

    location ~ ^/api/v1/identity/auth/login$ {
      limit_req zone=login_per_ip burst=29 nodelay;
      include /etc/nginx/proxy-common.conf;
      proxy_pass http://identity_api;
    }

    location ~ ^/api/v1/identity/auth/register$ {
      limit_req zone=register_per_ip burst=2 nodelay;
      include /etc/nginx/proxy-common.conf;
      proxy_pass http://identity_api;
    }

    location ~* ^/api/v1/response/requests/track/?$ {
      limit_req zone=tracking_per_ip burst=9 nodelay;
      limit_req zone=tracking_hourly_per_ip burst=59 nodelay;
      include /etc/nginx/proxy-common.conf;
      proxy_pass http://response_api;
    }

    location ~* ^/api/v1/response/requests/[^/]+/events/?$ {
      limit_req zone=tracking_per_ip burst=9 nodelay;
      limit_req zone=tracking_hourly_per_ip burst=59 nodelay;
      include /etc/nginx/proxy-common.conf;
      proxy_pass http://response_api;
    }

    location ~ ^/api/v1/response/.*/evidence(?:/|$) {
      client_max_body_size 55m;
      if ($content_length = "") { return 411; }
      limit_conn upload_concurrent_per_ip 2;
      proxy_read_timeout 120s;
      include /etc/nginx/proxy-common.conf;
      proxy_pass http://response_api;
    }

    location ~ ^/api/v1/logistics/.*/evidence(?:/|$) {
      # shortcut: no per-client hourly byte budget; add when upload quota accounting is implemented.
      client_max_body_size 55m;
      if ($content_length = "") { return 411; }
      limit_conn upload_concurrent_per_ip 2;
      include /etc/nginx/proxy-common.conf;
      proxy_pass http://logistics_api;
    }

    location ~ ^/c48-(response|logistics)-evidence/ {
      # MinIO is optional outside the storage profile, so resolve its Docker DNS name on demand.
      resolver 127.0.0.11 valid=30s;
      set $minio_upstream minio:9000;
      proxy_buffering off;
      proxy_pass_request_headers off;
      proxy_hide_header Cache-Control;
      add_header Cache-Control no-store always;
      add_header X-Content-Type-Options nosniff always;
      add_header Referrer-Policy no-referrer always;
      add_header Content-Security-Policy "default-src 'self'; frame-ancestors 'none'" always;
      proxy_set_header Range $http_range;
      proxy_set_header If-Range $http_if_range;
      proxy_set_header Host $http_host;
      proxy_pass http://$minio_upstream;
    }

    location /api/v1/identity/ {
      include /etc/nginx/proxy-common.conf;
      proxy_pass http://identity_api;
    }

    location ~* ^/api/v1/response/requests(?:/proxy)?/?$ {
      error_page 429 = @sos_rate_ceiling;
      include /etc/nginx/conf.d/sos-limits-location.conf;
      include /etc/nginx/proxy-common.conf;
      proxy_pass http://response_api;
    }

    location /api/v1/response/ {
      include /etc/nginx/proxy-common.conf;
      proxy_pass http://response_api;
    }

    location /api/v1/logistics/ {
      include /etc/nginx/proxy-common.conf;
      proxy_pass http://logistics_api;
    }

    location / {
      return 404;
    }
  }
}
