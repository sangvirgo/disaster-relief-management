name: c48-test

services:
  postgres:
    image: postgis/postgis:17-3.5@sha256:01a6a70e41e6c4467c8f55f6063555ed72db2d6662cd0d571040d42eadaeb6f6
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: test-only
    command: ["postgres", "-c", "max_connections=140", "-c", "shared_buffers=128MB"]
    tmpfs:
      - /var/lib/postgresql/data
    ports:
      - "127.0.0.1:${TEST_POSTGRES_PORT:-55432}:5432"
    volumes:
      - ../../docs/backend/schema:/schema:ro
      - ../scripts:/test/scripts:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 2s
      timeout: 2s
      retries: 30
    networks: [c48-test]

  db-init:
    image: postgis/postgis:17-3.5@sha256:01a6a70e41e6c4467c8f55f6063555ed72db2d6662cd0d571040d42eadaeb6f6
    entrypoint: ["/bin/bash", "/init.sh"]
    environment:
      POSTGRES_PASSWORD: test-only
      IDENTITY_MIGRATOR_PASSWORD: test-only
      IDENTITY_APP_PASSWORD: test-only
      RESPONSE_MIGRATOR_PASSWORD: test-only
      RESPONSE_APP_PASSWORD: test-only
      LOGISTICS_MIGRATOR_PASSWORD: test-only
      LOGISTICS_APP_PASSWORD: test-only
    volumes:
      - ./db-init/init.sh:/init.sh:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks: [c48-test]

  identity-migrate:
    image: c48-test/identity:local
    build:
      context: ../..
      dockerfile: backend/apps/identity/Dockerfile
    environment:
      DATABASE_URL: postgresql://identity_migrator:test-only@postgres:5432/c48_identity
      DB_POOL_MAX: "2"
      C48_SCHEMA_DIR: /workspace/backend/schema
    command: ["node", "dist/apps/identity/src/database/migrate.js"]
    depends_on:
      db-init:
        condition: service_completed_successfully
    profiles: [test]
    networks: [c48-test]

  response-migrate:
    image: c48-test/response:local
    build:
      context: ../..
      dockerfile: backend/apps/response/Dockerfile
    environment:
      DATABASE_URL: postgresql://response_migrator:test-only@postgres:5432/c48_response
      DB_POOL_MAX: "2"
      C48_SCHEMA_DIR: /workspace/backend/schema
    command: ["node", "dist/apps/response/src/database/migrate.js"]
    depends_on:
      db-init:
        condition: service_completed_successfully
    profiles: [test]
    networks: [c48-test]

  logistics-migrate:
    image: c48-test/logistics:local
    build:
      context: ../..
      dockerfile: backend/apps/logistics/Dockerfile
    environment:
      DATABASE_URL: postgresql://logistics_migrator:test-only@postgres:5432/c48_logistics
      DB_POOL_MAX: "2"
      C48_SCHEMA_DIR: /workspace/backend/schema
    command: ["node", "dist/apps/logistics/src/database/migrate.js"]
    depends_on:
      db-init:
        condition: service_completed_successfully
    profiles: [test]
    networks: [c48-test]

  identity-api:
    image: c48-test/identity:local
    environment:
      NODE_ENV: test
      PORT: "3001"
      DATABASE_URL: postgresql://identity_app_login:test-only@postgres:5432/c48_identity
      DB_POOL_MAX: "2"
      JWT_ISSUER: https://c48.test
      JWT_AUDIENCE: c48-test
      JWT_PRIVATE_KEY: ${RESPONSE_TEST_JWT_PRIVATE_KEY:-}
      WEB_ALLOWED_ORIGINS: http://localhost,https://c48.test
      RESPONSE_SERVICE_CLIENT_ID: c48-response-test
      RESPONSE_SERVICE_CLIENT_SECRET: c48-test-response-secret-not-for-deployment-0001
    command: ["node", "dist/apps/identity/src/main.js"]
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health/ready').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 2s
      timeout: 2s
      retries: 20
    profiles: [test]
    networks: [c48-test]

  response-api:
    image: c48-test/response:local
    environment: &response-test-environment
      NODE_ENV: test
      PORT: "3002"
      DATABASE_URL: postgresql://response_app_login:test-only@postgres:5432/c48_response
      DB_POOL_MAX: "2"
      JWT_ISSUER: https://c48.test
      JWT_AUDIENCE: c48-test
      JWT_PUBLIC_KEY_FILE: /run/secrets/response-test-public.pem
      WEB_ALLOWED_ORIGINS: https://c48.test
      SECRET_HASH_PEPPER_SOS: c48-test-sos-pepper-not-for-deployment-0001
      RESPONSE_SERVICE_CLIENT_ID: c48-response-test
      RESPONSE_SERVICE_CLIENT_SECRET: c48-test-response-secret-not-for-deployment-0001
      IDENTITY_BASE_URL: http://identity-api:3001
      INTROSPECT_TIMEOUT_MS: "500"
      S3_ENDPOINT: http://memory-storage.test
      S3_PUBLIC_ENDPOINT: http://memory-storage.test
      S3_BUCKET: c48-response-evidence
      S3_ACCESS_KEY: test-access-key
      S3_SECRET_KEY: test-secret-key-not-for-deployment
      SIGNED_URL_TTL_S: "60"
      SCHEDULER_ENABLED: "false"
      DEMO_INTAKE_ORGANIZATION_ID: 40000000-0000-4000-8000-000000000004
      SOS_SOFT_LIMIT_PER_IP: "2"
      SOS_GLOBAL_PER_MIN: "4"
    command: ["node", "dist/apps/response/src/main.js"]
    volumes:
      - ../test/fixtures/response-test-public.pem:/run/secrets/response-test-public.pem:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3002/health/ready').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 2s
      timeout: 2s
      retries: 20
    profiles: [test]
    networks: [c48-test]

  response-t5-api:
    image: c48-test/response:local
    environment:
      <<: *response-test-environment
      PORT: "3005"
      SOS_SOFT_LIMIT_PER_IP: "1000"
      SOS_GLOBAL_PER_MIN: "1000"
      SCHEDULER_ENABLED: "true"
    command: ["node", "dist/apps/response/src/main.js"]
    volumes:
      - ../test/fixtures/response-test-public.pem:/run/secrets/response-test-public.pem:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3005/health/ready').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 2s
      timeout: 2s
      retries: 20
    profiles: [test]
    networks: [c48-test]

  response-storage-down-api:
    image: c48-test/response:local
    environment:
      <<: *response-test-environment
      PORT: "3004"
      TEST_S3_FAIL: "true"
      IDENTITY_BASE_URL: http://127.0.0.1:1
    command: ["node", "dist/apps/response/src/main.js"]
    volumes:
      - ../test/fixtures/response-test-public.pem:/run/secrets/response-test-public.pem:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3004/health/ready').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 2s
      timeout: 2s
      retries: 20
    profiles: [test]
    networks: [c48-test]

  logistics-api:
    image: c48-test/logistics:local
    environment:
      NODE_ENV: test
      PORT: "3003"
      DATABASE_URL: postgresql://logistics_app_login:test-only@postgres:5432/c48_logistics
      DB_POOL_MAX: "2"
    command: ["node", "dist/apps/logistics/src/main.js"]
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3003/health/ready').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 2s
      timeout: 2s
      retries: 20
    profiles: [test]
    networks: [c48-test]

  nginx:
    image: nginx:1.30.5
    environment:
      SOS_SOFT_LIMIT_PER_IP: "2"
      SOS_HARD_LIMIT_PER_IP: "5"
      NGINX_ENVSUBST_FILTER: '^SOS_(SOFT_LIMIT_PER_IP|HARD_LIMIT_PER_IP|HARD_BURST_PER_IP)$'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/proxy-common.conf:/etc/nginx/proxy-common.conf:ro
      - ./nginx/sos-limits-zone.conf.template:/etc/nginx/templates/sos-limits-zone.conf.template:ro
      - ./nginx/sos-limits-location.conf.template:/etc/nginx/templates/sos-limits-location.conf.template:ro
      - ./nginx/15-sos-burst.envsh:/docker-entrypoint.d/15-sos-burst.envsh:ro
    depends_on:
      identity-api:
        condition: service_healthy
      response-api:
        condition: service_healthy
      logistics-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "nginx -t"]
      interval: 2s
      timeout: 3s
      retries: 10
    profiles: [test]
    networks: [c48-test]

  idempotency-test:
    image: c48-test/identity:local
    environment:
      DATABASE_URL: postgresql://identity_app_login:test-only@postgres:5432/c48_identity
    command: ["node", "scripts/test-idempotency.mjs"]
    profiles: [test]
    networks: [c48-test]

  auth-test:
    image: c48-test/identity:local
    environment:
      NODE_ENV: test
      TEST_DATABASE_URL: postgresql://identity_migrator:test-only@postgres:5432/c48_identity
      APP_TEST_DATABASE_URL: postgresql://identity_app_login:test-only@postgres:5432/c48_identity
      AUTH_TEST_BASE_URL: http://identity-api:3001/api/v1/identity
    command: ["node", "scripts/test-auth.mjs"]
    depends_on:
      identity-api:
        condition: service_healthy
    profiles: [test]
    networks: [c48-test]

  identity-admin-test:
    image: c48-test/identity:local
    environment:
      TEST_DATABASE_URL: postgresql://postgres:test-only@postgres:5432/c48_identity
      TEST_SERVICE_CLIENT_ID: c48-response-test
      TEST_SERVICE_CLIENT_SECRET: c48-test-response-secret-not-for-deployment-0001
      IDENTITY_ADMIN_TEST_BASE_URL: http://identity-api:3001/api/v1/identity
    command: ["node", "scripts/test-identity-admin.mjs"]
    depends_on:
      identity-api:
        condition: service_healthy
    profiles: [test]
    networks: [c48-test]

  response-intake-test:
    image: c48-test/response:local
    environment:
      TEST_DATABASE_URL: postgresql://postgres:test-only@postgres:5432/c48_response
      TEST_RESPONSE_BASE_URL: http://response-api:3002/api/v1/response
      TEST_RESPONSE_PROXY_BASE_URL: http://nginx/api/v1/response
      RESPONSE_TEST_PRIVATE_KEY_FILE: /test-fixtures/response-test-private.pem
    volumes:
      - ../test/fixtures/response-test-private.pem:/test-fixtures/response-test-private.pem:ro
    command: ["node", "scripts/test-response-intake.mjs"]
    depends_on:
      nginx:
        condition: service_healthy
    profiles: [test]
    networks: [c48-test]

  response-t5-test:
    image: c48-test/response:local
    environment:
      TEST_RESPONSE_DATABASE_URL: postgresql://postgres:test-only@postgres:5432/c48_response
      TEST_IDENTITY_DATABASE_URL: postgresql://postgres:test-only@postgres:5432/c48_identity
      TEST_RESPONSE_BASE_URL: http://response-t5-api:3005/api/v1/response
      TEST_RESPONSE_FAIL_BASE_URL: http://response-storage-down-api:3004/api/v1/response
      TEST_IDENTITY_BASE_URL: http://identity-api:3001/api/v1/identity
    command: ["node", "scripts/test-response-t5.mjs"]
    depends_on:
      response-t5-api:
        condition: service_healthy
      response-storage-down-api:
        condition: service_healthy
      identity-api:
        condition: service_healthy
    profiles: [test]
    networks: [c48-test]

networks:
  c48-test:
    driver: bridge
