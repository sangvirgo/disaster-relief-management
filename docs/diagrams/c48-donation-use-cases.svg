<text x="600" y="990" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#334155" stroke="white" stroke-width="5" paint-order="stroke">UC-11 has no mandatory login; name / phone are contact data, not credentials.</text>
<text x="600" y="1020" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#334155" stroke="white" stroke-width="5" paint-order="stroke">UC-12 separates intake and reviewer. UC-13 requires independent receiving confirmation.</text>
<text x="600" y="1050" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#334155" stroke="white" stroke-width="5" paint-order="stroke">AI UC-07 and stocktake UC-14 are deferred; no payment or full warehouse ERP.</text>
