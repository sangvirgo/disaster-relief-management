<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1090" viewBox="0 0 1200 1090" role="img" aria-labelledby="title desc"><title id="title">C48 | Quyên góp hiện vật và hỗ trợ</title><desc id="desc">Sơ đồ mô tả ca sử dụng backend của C48; kèm nguồn Draw.io để chỉnh sửa.</desc>
