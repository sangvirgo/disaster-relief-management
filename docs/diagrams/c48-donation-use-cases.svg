<text x="115.0" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#0f172a">Khách / công dân quyên góp</text>
<g fill="none" stroke="#334155" stroke-width="2"><circle cx="1090.0" cy="204" r="11"/><path d="M1090.0,215 V249 M1067.0,229 H1113.0 M1090.0,249 L1068.0,275 M1090.0,249 L1112.0,275"/></g>
<text x="1090.0" y="295" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#0f172a">Quản lý chiến dịch /</text>
<text x="1090.0" y="315" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#0f172a">vận hành</text>
<g fill="none" stroke="#334155" stroke-width="2"><circle cx="115.0" cy="469" r="11"/><path d="M115.0,480 V514 M92.0,494 H138.0 M115.0,514 L93.0,540 M115.0,514 L137.0,540"/></g>
<text x="115.0" y="560" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#0f172a">Nhân viên tiếp nhận kho</text>
<g fill="none" stroke="#334155" stroke-width="2"><circle cx="1090.0" cy="469" r="11"/><path d="M1090.0,480 V514 M1067.0,494 H1113.0 M1090.0,514 L1068.0,540 M1090.0,514 L1112.0,540"/></g>
<text x="1090.0" y="560" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#0f172a">Người thẩm định độc lập</text>
<g fill="none" stroke="#334155" stroke-width="2"><circle cx="115.0" cy="739" r="11"/><path d="M115.0,750 V784 M92.0,764 H138.0 M115.0,784 L93.0,810 M115.0,784 L137.0,810"/></g>
<text x="115.0" y="830" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#0f172a">Đại diện nơi nhận</text>
<g fill="none" stroke="#334155" stroke-width="2"><circle cx="1090.0" cy="774" r="11"/><path d="M1090.0,785 V819 M1067.0,799 H1113.0 M1090.0,819 L1068.0,845 M1090.0,819 L1112.0,845"/></g>
<text x="1090.0" y="865" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#0f172a">Quản trị viên</text>
<ellipse cx="425.0" cy="237.5" rx="125.0" ry="47.5" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
<text x="425.0" y="237.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#0f172a">Khai báo / theo dõi riêng</text>
<ellipse cx="775.0" cy="237.5" rx="125.0" ry="47.5" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
<text x="775.0" y="237.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#0f172a">Công khai / quản lý đợt quyên góp</text>
<ellipse cx="425.0" cy="497.5" rx="125.0" ry="47.5" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
<text x="425.0" y="497.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#0f172a">Kiểm đếm / thẩm định / ghi sổ</text>
<ellipse cx="775.0" cy="497.5" rx="125.0" ry="47.5" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
<text x="775.0" y="497.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#0f172a">Duyệt / xuất kho / bàn giao</text>
<ellipse cx="425.0" cy="797.5" rx="125.0" ry="47.5" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
<text x="425.0" y="797.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#0f172a">Báo cáo theo phạm vi</text>
<ellipse cx="775.0" cy="797.5" rx="125.0" ry="47.5" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
<text x="775.0" y="797.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#0f172a">Tài khoản / quyền theo phạm vi</text>
<text x="600" y="990" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#334155" stroke="white" stroke-width="5" paint-order="stroke">Không bắt buộc đăng nhập để khai báo quyên góp; tên / số điện thoại chỉ dùng liên hệ, không phải thông tin xác thực.</text>
<text x="600" y="1020" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#334155" stroke="white" stroke-width="5" paint-order="stroke">Khâu tiếp nhận và thẩm định biên nhận do người khác nhau thực hiện. Phân phối cần xác nhận nhận hàng độc lập.</text>
<text x="600" y="1050" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#334155" stroke="white" stroke-width="5" paint-order="stroke">Gợi ý AI chưa triển khai; quy trình kiểm kê kho đang hoãn. Không có thanh toán hoặc phần mềm quản lý kho toàn diện.</text>
</svg>
