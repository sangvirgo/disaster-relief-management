<text x="40" y="638" font-family="Arial, sans-serif" font-size="13" fill="#334155">One mission = one request, one team; capacity one active mission per team.</text>
<text x="40" y="662" font-family="Arial, sans-serif" font-size="13" fill="#334155">P1: nearest team first; P3/P4: lighter recent workload within 2 km band.</text>
<text x="40" y="686" font-family="Arial, sans-serif" font-size="13" fill="#334155">Offer is rechecked atomically; suggestion never dispatches automatically.</text>
<text x="40" y="710" font-family="Arial, sans-serif" font-size="13" fill="#334155">Links: UR-03/04, FR-MSN-01..06, TC-07, TC-12..14, TC-REV-05..07/11/13</text>
<text x="40" y="772" font-family="Arial, sans-serif" font-size="12" fill="#64748b">Dashed ellipses are neighbouring use cases. Proposed design, not implemented behaviour. Associations show participation; backend grants decide permission.</text>
