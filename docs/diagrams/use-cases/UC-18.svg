<text x="40" y="638" font-family="Arial, sans-serif" font-size="13" fill="#334155">Position older than 30 min is flagged; coordinator-set positions are labelled and audited.</text>
<text x="40" y="662" font-family="Arial, sans-serif" font-size="13" fill="#334155">No background tracking; affiliation (volunteer / military / government) grants no extra rights.</text>
<text x="40" y="686" font-family="Arial, sans-serif" font-size="13" fill="#334155">Links: UR-04, FR-MSN-01, FR-TEAM-01, TC-REV-05/11</text>
<text x="40" y="772" font-family="Arial, sans-serif" font-size="12" fill="#64748b">Dashed ellipses are neighbouring use cases. Proposed design, not implemented behaviour. Associations show participation; backend grants decide permission.</text>
