<text x="40" y="638" font-family="Arial, sans-serif" font-size="13" fill="#334155">Scoped by organization and region; inactive point cannot receive new distributions.</text>
<text x="40" y="662" font-family="Arial, sans-serif" font-size="13" fill="#334155">No routing, fuel or maintenance workflow; assets hold no stock themselves.</text>
<text x="40" y="686" font-family="Arial, sans-serif" font-size="13" fill="#334155">Links: UR-05, FR-LOG-01, TC-BE-21</text>
<text x="40" y="772" font-family="Arial, sans-serif" font-size="12" fill="#64748b">Dashed ellipses are neighbouring use cases. Proposed design, not implemented behaviour. Associations show participation; backend grants decide permission.</text>
