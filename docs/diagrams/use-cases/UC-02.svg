<text x="1290" y="412" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#0f172a">Citizen / guest reporter</text>
<text x="1290" y="427" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#0f172a">(informed of outcome)</text>
<line x1="1272" y1="352" x2="875" y2="360" stroke="#475569" stroke-width="1.5"/>
<text x="40" y="638" font-family="Arial, sans-serif" font-size="13" fill="#334155">Exactly one outcome: VERIFIED (with basis), REJECTED (reason) or DUPLICATE (canonical).</text>
<text x="40" y="662" font-family="Arial, sans-serif" font-size="13" fill="#334155">NO_ANSWER alone never verifies or rejects; PROXY needs corroboration or 2 coordinators.</text>
<text x="40" y="686" font-family="Arial, sans-serif" font-size="13" fill="#334155">Priority is separate from status; no automatic triage or dispatch.</text>
<text x="40" y="710" font-family="Arial, sans-serif" font-size="13" fill="#334155">Links: UR-03, FR-REQ-04/05/10, TC-BE-03/11/25</text>
<text x="40" y="772" font-family="Arial, sans-serif" font-size="12" fill="#64748b">Dashed ellipses are neighbouring use cases. Proposed design, not implemented behaviour. Associations show participation; backend grants decide permission.</text>
</svg>
