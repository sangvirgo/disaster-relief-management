<text x="40" y="638" font-family="Arial, sans-serif" font-size="13" fill="#334155">Preparer and approver are distinct; edits after approval invalidate it.</text>
<text x="40" y="662" font-family="Arial, sans-serif" font-size="13" fill="#334155">Point receipt is not final household delivery; each unit is ISSUED exactly once.</text>
<text x="40" y="686" font-family="Arial, sans-serif" font-size="13" fill="#334155">issued = received + returned + lost + still in transit.</text>
<text x="40" y="710" font-family="Arial, sans-serif" font-size="13" fill="#334155">Links: UR-10, FR-LOG-06/07, TC-DIST-01..04</text>
<text x="40" y="772" font-family="Arial, sans-serif" font-size="12" fill="#64748b">Dashed ellipses are neighbouring use cases. Proposed design, not implemented behaviour. Associations show participation; backend grants decide permission.</text>
