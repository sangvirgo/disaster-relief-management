<text x="40" y="638" font-family="Arial, sans-serif" font-size="13" fill="#334155">Outstanding = requested - delivered; partial delivery never closes a need.</text>
<text x="40" y="662" font-family="Arial, sans-serif" font-size="13" fill="#334155">delivered + reserved + issued-unsettled never exceeds requested.</text>
<text x="40" y="686" font-family="Arial, sans-serif" font-size="13" fill="#334155">Mission completion does not fulfil needs; delivery does not complete a mission.</text>
<text x="40" y="710" font-family="Arial, sans-serif" font-size="13" fill="#334155">Links: UR-05, FR-LOG-03/05, FR-REQ-09, TC-31, TC-BE-05/09/15/17..19/26</text>
<text x="40" y="772" font-family="Arial, sans-serif" font-size="12" fill="#64748b">Dashed ellipses are neighbouring use cases. Proposed design, not implemented behaviour. Associations show participation; backend grants decide permission.</text>
