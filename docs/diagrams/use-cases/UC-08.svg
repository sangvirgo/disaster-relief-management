<text x="40" y="638" font-family="Arial, sans-serif" font-size="13" fill="#334155">Lifecycle: DRAFT &gt; ACTIVE &lt;&gt; PAUSED &gt; CLOSED; close blocked while linked requests are non-terminal.</text>
<text x="40" y="662" font-family="Arial, sans-serif" font-size="13" fill="#334155">SOS never requires a campaign; PAUSED blocks new attachments, offers and acceptance.</text>
<text x="40" y="686" font-family="Arial, sans-serif" font-size="13" fill="#334155">Links: UR-05, FR-CAM-01, TC-30, TC-BE-02/13</text>
<text x="40" y="772" font-family="Arial, sans-serif" font-size="12" fill="#64748b">Dashed ellipses are neighbouring use cases. Proposed design, not implemented behaviour. Associations show participation; backend grants decide permission.</text>
