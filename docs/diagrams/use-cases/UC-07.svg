<text x="40" y="638" font-family="Arial, sans-serif" font-size="13" fill="#334155">OPTIONAL extension, disabled by default; manual triage always available.</text>
<text x="40" y="662" font-family="Arial, sans-serif" font-size="13" fill="#334155">Suggestion may abstain; stale input or unverified/terminal request cannot be accepted.</text>
<text x="40" y="686" font-family="Arial, sans-serif" font-size="13" fill="#334155">AI never changes priority, status or assignment by itself.</text>
<text x="40" y="710" font-family="Arial, sans-serif" font-size="13" fill="#334155">Links: FR-AI-01..06, TC-26/27, TC-AI-01..22</text>
<text x="40" y="772" font-family="Arial, sans-serif" font-size="12" fill="#64748b">Dashed ellipses are neighbouring use cases. Proposed design, not implemented behaviour. Associations show participation; backend grants decide permission.</text>
