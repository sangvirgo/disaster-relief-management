<svg xmlns="http://www.w3.org/2000/svg" width="420mm" height="297mm" viewBox="0 0 1900 1344" role="img"><title>Object-storage failover and open issues</title><desc>A circuit breaker moves uploads between MinIO and S3; a drain job returns S3 objects to MinIO after recovery.</desc><defs>
<marker id="ma" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1 L9 5 L1 9 z" fill="#4f5d75"/></marker>
<marker id="mc" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1 L9 5 L1 9 z" fill="#bf4520"/></marker>
<marker id="ml" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1 L9 5 L1 9 z" fill="#2e5aa8"/></marker>
</defs><pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="0.9" fill="#2d3142" fill-opacity="0.10"/></pattern><rect width="1900" height="1344" fill="#f5f5f5"/><rect width="1900" height="1344" fill="url(#dots)"/><text x="40" y="58" font-family="DejaVu Sans Mono" font-size="12" letter-spacing="2.4" fill="#bf4520">RELIVA · C48  ·  OBJECT STORAGE</text><text x="40" y="108" font-family="DejaVu Serif" font-style="italic" font-size="44" fill="#2d3142">MinIO to S3 failover</text><text x="40" y="142" font-family="Fira Sans" font-size="16" fill="#4f5d75">Circuit-breaker behaviour, drain job and the issues to resolve first.</text><line x1="40" y1="160" x2="1860" y2="160" stroke="#2d3142" stroke-opacity="0.25"/><rect x="60" y="820" width="1760" height="200" rx="8" fill="rgba(45,49,66,0.03)" stroke="#2d3142" stroke-opacity="0.35" stroke-dasharray="5 4"/><rect x="74" y="812" width="425.5" height="16" fill="#f5f5f5"/><text x="82" y="823.5" font-family="DejaVu Sans Mono" font-size="10" letter-spacing="1.2" fill="#5a6580">DRAIN JOB · IDEMPOTENT · RESUMABLE · RUNS INSIDE EXISTING BACKEND</text><rect x="60" y="1070" width="1760" height="170" rx="8" fill="rgba(45,49,66,0.03)" stroke="#2d3142" stroke-opacity="0.35" stroke-dasharray="5 4"/><rect x="74" y="1062" width="349.9" height="16" fill="#f5f5f5"/><text x="82" y="1073.5" font-family="DejaVu Sans Mono" font-size="10" letter-spacing="1.2" fill="#5a6580">OPEN ISSUES FOUND IN REVIEW · FIX BEFORE IMPLEMENTING</text><path d="M420,340 H800" fill="none" stroke="#4f5d75" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#ma)"/><path d="M1100,340 H1480" fill="none" stroke="#4f5d75" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#ma)"/><path d="M1630,410 V480 H270 V410" fill="none" stroke="#4f5d75" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#ma)"/><path d="M1630,300 V250 H1020 V300" fill="none" stroke="#bf4520" stroke-width="1.6" stroke-dasharray="6 4" stroke-linejoin="round" marker-end="url(#mc)"/><path d="M400,920 H520" fill="none" stroke="#4f5d75" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#ma)"/><path d="M820,920 H940" fill="none" stroke="#4f5d75" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#ma)"/><path d="M1260,920 H1380" fill="none" stroke="#4f5d75" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#ma)"/><rect x="542" y="322" width="136" height="14" fill="#f5f5f5"/><text x="610" y="332" text-anchor="middle" font-family="DejaVu Sans Mono" font-size="9" letter-spacing="0.6" fill="#5a6580">N FAILURES / TIMEOUTS</text><rect x="1243" y="322" width="95" height="14" fill="#f5f5f5"/><text x="1290" y="332" text-anchor="middle" font-family="DejaVu Sans Mono" font-size="9" letter-spacing="0.6" fill="#5a6580">RETRY INTERVAL</text><rect x="826" y="462" width="248" height="14" fill="#f5f5f5"/><text x="950" y="472" text-anchor="middle" font-family="DejaVu Sans Mono" font-size="9" letter-spacing="0.6" fill="#5a6580">PROBE OK · BREAKER CLOSES · DRAIN STARTS</text><rect x="1251" y="232" width="148" height="14" fill="#f5f5f5"/><text x="1325" y="242" text-anchor="middle" font-family="DejaVu Sans Mono" font-size="9" letter-spacing="0.6" fill="#bf4520">PROBE FAILS · STAY OPEN</text><rect x="120" y="300" width="300" height="110" rx="6" fill="#f5f5f5"/><rect x="120" y="300" width="300" height="110" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1.3"/><rect x="130" y="309" width="38" height="14" rx="2" fill="none" stroke="#4f5d75" stroke-width="0.9"/><text x="135" y="319.2" font-family="DejaVu Sans Mono" font-size="8" letter-spacing="1" fill="#4f5d75">STATE</text><text x="270.0" y="344" text-anchor="middle" font-family="Fira Sans" font-weight="600" font-size="15" fill="#2d3142">CLOSED</text><text x="270.0" y="361" text-anchor="middle" font-family="DejaVu Sans Mono" font-size="9.5" fill="#5a6580">normal operation</text><text x="270.0" y="374" text-anchor="middle" font-family="DejaVu Sans Mono" font-size="9.5" fill="#5a6580">reads and writes use MinIO</text><rect x="800" y="300" width="300" height="110" rx="6" fill="#f5f5f5"/><rect x="800" y="300" width="300" height="110" rx="6" fill="#f1ddd6" stroke="#bf4520" stroke-width="1.8"/><rect x="810" y="309" width="38" height="14" rx="2" fill="none" stroke="#bf4520" stroke-width="0.9"/><text x="815" y="319.2" font-family="DejaVu Sans Mono" font-size="8" letter-spacing="1" fill="#bf4520">STATE</text><text x="950.0" y="344" text-anchor="middle" font-family="Fira Sans" font-weight="600" font-size="15" fill="#2d3142">OPEN</text><text x="950.0" y="361" text-anchor="middle" font-family="DejaVu Sans Mono" font-size="9.5" fill="#5a6580">fallback mode</text><text x="950.0" y="374" text-anchor="middle" font-family="DejaVu Sans Mono" font-size="9.5" fill="#5a6580">new uploads go to S3</text><rect x="1480" y="300" width="300" height="110" rx="6" fill="#f5f5f5"/><rect x="1480" y="300" width="300" height="110" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1.3"/><rect x="1490" y="309" width="38" height="14" rx="2" fill="none" stroke="#4f5d75" stroke-width="0.9"/><text x="1495" y="319.2" font-family="DejaVu Sans Mono" font-size="8" letter-spacing="1" fill="#4f5d75">STATE</text><text x="1630.0" y="344" text-anchor="middle" font-family="Fira Sans" font-weight="600" font-size="15" fill="#2d3142">HALF-OPEN</text><text x="1630.0" y="361" text-anchor="middle" font-family="DejaVu Sans Mono" font-size="9.5" fill="#5a6580">probing MinIO</text><text x="1630.0" y="374" text-anchor="middle" font-family="DejaVu Sans Mono" font-size="9.5" fill="#5a6580">trial request only</text><rect x="100" y="870" width="300" height="100" rx="6" fill="#f5f5f5"/><rect x="100" y="870" width="300" height="100" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1.3"/><rect x="110" y="879" width="44" height="14" rx="2" fill="none" stroke="#4f5d75" stroke-width="0.9"/><text x="115" y="889.2" font-family="DejaVu Sans Mono" font-size="8" letter-spacing="1" fill="#4f5d75">STEP 1</text><text x="250.0" y="914" text-anchor="middle" font-family="Fira Sans" font-weight="600" font-size="15" fill="#2d3142">Copy to MinIO</text><text x="250.0" y="931" text-anchor="middle" font-family="DejaVu Sans Mono" font-size="9.5" fill="#5a6580">each S3 object</text><rect x="520" y="870" width="300" height="100" rx="6" fill="#f5f5f5"/><rect x="520" y="870" width="300" height="100" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1.3"/><rect x="530" y="879" width="44" height="14" rx="2" fill="none" stroke="#4f5d75" stroke-width="0.9"/><text x="535" y="889.2" font-family="DejaVu Sans Mono" font-size="8" letter-spacing="1" fill="#4f5d75">STEP 2</text><text x="670.0" y="914" text-anchor="middle" font-family="Fira Sans" font-weight="600" font-size="15" fill="#2d3142">Verify checksum</text><text x="670.0" y="931" text-anchor="middle" font-family="DejaVu Sans Mono" font-size="9.5" fill="#5a6580">size + hash match</text><rect x="940" y="870" width="320" height="100" rx="6" fill="#f5f5f5"/><rect x="940" y="870" width="320" height="100" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1.3"/><rect x="950" y="879" width="44" height="14" rx="2" fill="none" stroke="#4f5d75" stroke-width="0.9"/><text x="955" y="889.2" font-family="DejaVu Sans Mono" font-size="8" letter-spacing="1" fill="#4f5d75">STEP 3</text><text x="1100.0" y="914" text-anchor="middle" font-family="Fira Sans" font-weight="600" font-size="15" fill="#2d3142">Update backend column</text><text x="1100.0" y="931" text-anchor="middle" font-family="DejaVu Sans Mono" font-size="9.5" fill="#5a6580">storage_backend = minio</text><rect x="1380" y="870" width="400" height="100" rx="6" fill="#f5f5f5"/><rect x="1380" y="870" width="400" height="100" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1.3"/><rect x="1390" y="879" width="44" height="14" rx="2" fill="none" stroke="#4f5d75" stroke-width="0.9"/><text x="1395" y="889.2" font-family="DejaVu Sans Mono" font-size="8" letter-spacing="1" fill="#4f5d75">STEP 4</text><text x="1580.0" y="914" text-anchor="middle" font-family="Fira Sans" font-weight="600" font-size="15" fill="#2d3142">Delete S3 copy</text><text x="1580.0" y="931" text-anchor="middle" font-family="DejaVu Sans Mono" font-size="9.5" fill="#5a6580">bucket returns to empty</text><g font-family="Fira Sans"><rect x="60" y="560" width="520" height="160" rx="6" fill="#fff" stroke="#2d3142" stroke-width="1"/><text x="80" y="590" font-family="DejaVu Sans Mono" font-size="10" letter-spacing="1.4" fill="#2d3142">NORMAL</text><text x="80" y="624" font-family="DejaVu Sans Mono" font-size="10" fill="#5a6580">READS</text><text x="170" y="625" font-size="14" fill="#2d3142">from MinIO</text><text x="80" y="658" font-family="DejaVu Sans Mono" font-size="10" fill="#5a6580">WRITES</text><text x="170" y="659" font-size="14" fill="#2d3142">to MinIO</text><text x="80" y="692" font-family="DejaVu Sans Mono" font-size="10" fill="#5a6580">S3</text><text x="170" y="693" font-size="14" fill="#2d3142">empty, no cost</text></g><g font-family="Fira Sans"><rect x="690" y="560" width="520" height="160" rx="6" fill="#fff" stroke="#bf4520" stroke-width="1.6"/><text x="710" y="590" font-family="DejaVu Sans Mono" font-size="10" letter-spacing="1.4" fill="#bf4520">MINIO DOWN</text><text x="710" y="624" font-family="DejaVu Sans Mono" font-size="10" fill="#5a6580">READS</text><text x="800" y="625" font-size="14" fill="#2d3142">S3 objects only; MinIO-only files unavailable</text><text x="710" y="658" font-family="DejaVu Sans Mono" font-size="10" fill="#5a6580">WRITES</text><text x="800" y="659" font-size="14" fill="#2d3142">new objects to S3</text><text x="710" y="692" font-family="DejaVu Sans Mono" font-size="10" fill="#5a6580">USER</text><text x="800" y="693" font-size="14" fill="#2d3142">Vietnamese message + stable error code</text></g><g font-family="Fira Sans"><rect x="1320" y="560" width="520" height="160" rx="6" fill="#fff" stroke="#2d3142" stroke-width="1"/><text x="1340" y="590" font-family="DejaVu Sans Mono" font-size="10" letter-spacing="1.4" fill="#2d3142">RECOVERY</text><text x="1340" y="624" font-family="DejaVu Sans Mono" font-size="10" fill="#5a6580">READS</text><text x="1430" y="625" font-size="14" fill="#2d3142">both backends readable</text><text x="1340" y="658" font-family="DejaVu Sans Mono" font-size="10" fill="#5a6580">WRITES</text><text x="1430" y="659" font-size="14" fill="#2d3142">back to MinIO</text><text x="1340" y="692" font-family="DejaVu Sans Mono" font-size="10" fill="#5a6580">DRAIN</text><text x="1430" y="693" font-size="14" fill="#2d3142">S3 objects move back to MinIO</text></g><g font-family="Fira Sans"><text x="90" y="1115" font-weight="600" font-size="15" fill="#bf4520">1  Real client IP</text><text x="90" y="1142" font-size="13" fill="#2d3142">nginx sees the tunnel address, not the user: per-IP SOS</text><text x="90" y="1164" font-size="13" fill="#2d3142">limits would hit everyone. Add trusted real-IP</text><text x="90" y="1186" font-size="13" fill="#2d3142">handling.</text></g><g font-family="Fira Sans"><text x="670" y="1115" font-weight="600" font-size="15" fill="#bf4520">2  Signed URLs and CSP</text><text x="670" y="1142" font-size="13" fill="#2d3142">S3 objects cannot be served through the nginx MinIO</text><text x="670" y="1164" font-size="13" fill="#2d3142">path or the current CSP. Stream them through the</text><text x="670" y="1186" font-size="13" fill="#2d3142">backend.</text></g><g font-family="Fira Sans"><text x="1250" y="1115" font-weight="600" font-size="15" fill="#bf4520">3  Schema contract</text><text x="1250" y="1142" font-size="13" fill="#2d3142">storage_backend column is missing from the response and</text><text x="1250" y="1164" font-size="13" fill="#2d3142">logistics schemas; record it in docs/backend first.</text></g><line x1="40" y1="1284" x2="1860" y2="1284" stroke="#2d3142" stroke-opacity="0.25"/><line x1="40" y1="1310" x2="74" y2="1310" stroke="#4f5d75" stroke-width="1.6"/><text x="84" y="1314" font-family="DejaVu Sans Mono" font-size="10" fill="#5a6580">state change</text><line x1="191.2" y1="1310" x2="225.2" y2="1310" stroke="#bf4520" stroke-width="1.6" stroke-dasharray="5 4"/><text x="235.2" y="1314" font-family="DejaVu Sans Mono" font-size="10" fill="#5a6580">failure path</text><rect x="342.4" y="1302" width="34" height="16" rx="3" fill="#f1ddd6" stroke="#bf4520" stroke-width="1.6"/><text x="386.4" y="1314" font-family="DejaVu Sans Mono" font-size="10" fill="#5a6580">fallback state</text></svg>