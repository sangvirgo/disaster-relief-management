235" width="320" height="100" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1.3"/><rect x="1150" y="244" width="49" height="14" rx="2" fill="none" stroke="#4f5d75" stroke-width="0.9"/><text x="1155" y="254.2" font-family="DejaVu Sans Mono" font-size="8" letter-spacing="1" fill="#4f5d75">FAILURE</text><text x="1300.0" y="279" text-anchor="middle" font-family="Fira Sans" font-weight="600" font-size="15" fill="#2d3142">File deleted</text><text x="1300.0" y="296" text-anchor="middle" font-family="DejaVu Sans Mono" font-size="9.5" fill="#5a6580">versioning NOT enabled</text><text x="1300.0" y="309" text-anchor="middle" font-family="DejaVu Sans Mono" font-size="9.5" fill="#5a6580">enable to recover</text><rect x="1490" y="235" width="320" height="100" rx="6" fill="#f5f5f5"/><rect x="1490" y="235" width="320" height="100" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1.3"/><rect x="1500" y="244" width="49" height="14" rx="2" fill="none" stroke="#4f5d75" stroke-width="0.9"/><text x="1505" y="254.2" font-family="DejaVu Sans Mono" font-size="8" letter-spacing="1" fill="#4f5d75">FAILURE</text><text x="1650.0" y="279" text-anchor="middle" font-family="Fira Sans" font-weight="600" font-size="15" fill="#2d3142">Host dies</text><text x="1650.0" y="296" text-anchor="middle" font-family="DejaVu Sans Mono" font-size="9.5" fill="#5a6580">rebuild from Git + restore</text><text x="1650.0" y="309" text-anchor="middle" font-family="DejaVu Sans Mono" font-size="9.5" fill="#5a6580">hours (RTO)</text><rect x="90" y="570" width="300" height="100" rx="6" fill="#f5f5f5"/><rect x="90" y="570" width="300" height="100" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1.3"/><rect x="100" y="579" width="44" height="14" rx="2" fill="none" stroke="#4f5d75" stroke-width="0.9"/><text x="105" y="589.2" font-family="DejaVu Sans Mono" font-size="8" letter-spacing="1" fill="#4f5d75">STEP 1</text><text x="240.0" y="614" text-anchor="middle" font-family="Fira Sans" font-weight="600" font-size="15" fill="#2d3142">Dump</text><text x="240.0" y="631" text-anchor="middle" font-family="DejaVu Sans Mono" font-size="9.5" fill="#5a6580">pg_dump ×3 databases</text><rect x="440" y="570" width="300" height="100" rx="6" fill="#f5f5f5"/><rect x="440" y="570" width="300" height="100" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1.3"/><rect x="450" y="579" width="44" height="14" rx="2" fill="none" stroke="#4f5d75" stroke-width="0.9"/><text x="455" y="589.2" font-family="DejaVu Sans Mono" font-size="8" letter-spacing="1" fill="#4f5d75">STEP 2</text><text x="590.0" y="614" text-anchor="middle" font-family="Fira Sans" font-weight="600" font-size="15" fill="#2d3142">Manifest</text><text x="590.0" y="631" text-anchor="middle" font-family="DejaVu Sans Mono" font-size="9.5" fill="#5a6580">SHA-256 + timestamp</text><rect x="790" y="570" width="300" height="100" rx="6" fill="#f5f5f5"/><rect x="790" y="570" width="300" height="100" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1.3"/><rect x="800" y="579" width="44" height="14" rx="2" fill="none" stroke="#4f5d75" stroke-width="0.9"/><text x="805" y="589.2" font-family="DejaVu Sans Mono" font-size="8" letter-spacing="1" fill="#4f5d75">STEP 3</text><text x="940.0" y="614" text-anchor="middle" font-family="Fira Sans" font-weight="600" font-size="15" fill="#2d3142">Verify</text><text x="940.0" y="631" text-anchor="middle" font-family="DejaVu Sans Mono" font-size="9.5" fill="#5a6580">pg_restore --list</text><rect x="1140" y="570" width="300" height="100" rx="6" fill="#f5f5f5"/><rect x="1140" y="570" width="300" height="100" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1.3"/><rect x="1150" y="579" width="44" height="14" rx="2" fill="none" stroke="#4f5d75" stroke-width="0.9"/><text x="1155" y="589.2" font-family="DejaVu Sans Mono" font-size="8" letter-spacing="1" fill="#4f5d75">STEP 4</text><text x="1290.0" y="614" text-anchor="middle" font-family="Fira Sans" font-weight="600" font-size="15" fill="#2d3142">Upload</text><text x="1290.0" y="631" text-anchor="middle" font-family="DejaVu Sans Mono" font-size="9.5" fill="#5a6580">S3 checksum check</text><rect x="1490" y="570" width="300" height="100" rx="6" fill="#f5f5f5"/><rect x="1490" y="570" width="300" height="100" rx="6" fill="#f1ddd6" stroke="#bf4520" stroke-width="1.8"/><rect x="1500" y="579" width="44" height="14" rx="2" fill="none" stroke="#bf4520" stroke-width="0.9"/><text x="1505" y="589.2" font-family="DejaVu Sans Mono" font-size="8" letter-spacing="1" fill="#bf4520">STEP 5</text><text x="1640.0" y="614" text-anchor="middle" font-family="Fira Sans" font-weight="600" font-size="15" fill="#2d3142">Rotate</text><text x="1640.0" y="631" text-anchor="middle" font-family="DejaVu Sans Mono" font-size="9.5" fill="#5a6580">keep 2 newest, delete oldest</text><rect x="90" y="840" width="300" height="100" rx="6" fill="#f5f5f5"/><rect x="90" y="840" width="300" height="100" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1.3"/><rect x="100" y="849" width="44" height="14" rx="2" fill="none" stroke="#4f5d75" stroke-width="0.9"/><text x="105" y="859.2" font-family="DejaVu Sans Mono" font-size="8" letter-spacing="1" fill="#4f5d75">STEP 1</text><text x="240.0" y="884" text-anchor="middle" font-family="Fira Sans" font-weight="600" font-size="15" fill="#2d3142">Pre-deploy dump</text><text x="240.0" y="901" text-anchor="middle" font-family="DejaVu Sans Mono" font-size="9.5" fill="#5a6580">latest one kept</text><rect x="440" y="840" width="300" height="100" rx="6" fill="#f5f5f5"/><rect x="440" y="840" width="300" height="100" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1.3"/><rect x="450" y="849" width="44" height="14" rx="2" fill="none" stroke="#4f5d75" stroke-width="0.9"/><text x="455" y="859.2" font-family="DejaVu Sans Mono" font-size="8" letter-spacing="1" fill="#4f5d75">STEP 2</text><text x="590.0" y="884" text-anchor="middle" font-family="Fira Sans" font-weight="600" font-size="15" fill="#2d3142">Mark previous</text><text x="590.0" y="901" text-anchor="middle" font-family="DejaVu Sans Mono" font-size="9.5" fill="#5a6580">keep old image tag + .env</text><rect x="790" y="840" width="300" height="100" rx="6" fill="#f5f5f5"/><rect x="790" y="840" width="300" height="100" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1.3"/><rect x="800" y="849" width="44" height="14" rx="2" fill="none" stroke="#4f5d75" stroke-width="0.9"/><text x="805" y="859.2" font-family="DejaVu Sans Mono" font-size="8" letter-spacing="1" fill="#4f5d75">STEP 3</text><text x="940.0" y="884" text-anchor="middle" font-family="Fira Sans" font-weight="600" font-size="15" fill="#2d3142">Pull new tag</text><text x="940.0" y="901" text-anchor="middle" font-family="DejaVu Sans Mono" font-size="9.5" fill="#5a6580">commit SHA, migrate</text><rect x="1140" y="840" width="300" height="100" rx="6" fill="#f5f5f5"/><rect x="1140" y="840" width="300" height="100" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1.3"/><rect x="1150" y="849" width="44" height="14" rx="2" fill="none" stroke="#4f5d75" stroke-width="0.9"/><text x="1155" y="859.2" font-family="DejaVu Sans Mono" font-size="8" letter-spacing="1" fill="#4f5d75">STEP 4</text><text x="1290.0" y="884" text-anchor="middle" font-family="Fira Sans" font-weight="600" font-size="15" fill="#2d3142">Health check</text><text x="1290.0" y="901" text-anchor="middle" font-family="DejaVu Sans Mono" font-size="9.5" fill="#5a6580">/health/ready + smoke</text><rect x="1490" y="840" width="300" height="100" rx="6" fill="#f5f5f5"/><rect x="1490" y="840" width="300" height="100" rx="6" fill="#f1ddd6" stroke="#bf4520" stroke-width="1.8"/><rect x="1500" y="849" width="66" height="14" rx="2" fill="none" stroke="#bf4520" stroke-width="0.9"/><text x="1505" y="859.2" font-family="DejaVu Sans Mono" font-size="8" letter-spacing="1" fill="#bf4520">ON FAILURE</text><text x="1640.0" y="884" text-anchor="middle" font-family="Fira Sans" font-weight="600" font-size="15" fill="#2d3142">Roll back</text><text x="1640.0" y="901" text-anchor="middle" font-family="DejaVu Sans Mono" font-size="9.5" fill="#5a6580">start previous tag</text><rect x="90" y="1110" width="500" height="110" rx="6" fill="#f5f5f5"/><rect x="90" y="1110" width="500" height="110" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1.3"/><rect x="100" y="1119" width="27" height="14" rx="2" fill="none" stroke="#4f5d75" stroke-width="0.9"/><text x="105" y="1129.2" font-family="DejaVu Sans Mono" font-size="8" letter-spacing="1" fill="#4f5d75">NOW</text><text x="340.0" y="1154" text-anchor="middle" font-family="Fira Sans" font-weight="600" font-size="15" fill="#2d3142">Phase 0 · Compose</text><text x="340.0" y="1171" text-anchor="middle" font-family="DejaVu Sans Mono" font-size="9.5" fill="#5a6580">one t3.medium</text><text x="340.0" y="1184" text-anchor="middle" font-family="DejaVu Sans Mono" font-size="9.5" fill="#5a6580">containers, S3, rollback, backup live</text><rect x="700" y="1110" width="500" height="110" rx="6" fill="#f5f5f5"/><rect x="700" y="1110" width="500" height="110" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1.3"/><rect x="710" y="1119" width="32" height="14" rx="2" fill="none" stroke="#4f5d75" stroke-width="0.9"/><text x="715" y="1129.2" font-family="DejaVu Sans Mono" font-size="8" letter-spacing="1" fill="#4f5d75">NEXT</text><text x="950.0" y="1154" text-anchor="middle" font-family="Fira Sans" font-weight="600" font-size="15" fill="#2d3142">Phase 1 · Measure</text><text x="950.0" y="1171" text-anchor="middle" font-family="DejaVu Sans Mono" font-size="9.5" fill="#5a6580">k6 load test</text><text x="950.0" y="1184" text-anchor="middle" font-family="DejaVu Sans Mono" font-size="9.5" fill="#5a6580">find the bottleneck, scale up if needed</text><rect x="1310" y="1110" width="500" height="110" rx="6" fill="#f5f5f5"/><rect x="1310" y="1110" width="500" height="110" rx="6" fill="#f1ddd6" stroke="#bf4520" stroke-width="1.8"/><rect x="1320" y="1119" width="38" height="14" rx="2" fill="none" stroke="#bf4520" stroke-width="0.9"/><text x="1325" y="1129.2" font-family="DejaVu Sans Mono" font-size="8" letter-spacing="1" fill="#bf4520">LATER</text><text x="1560.0" y="1154" text-anchor="middle" font-family="Fira Sans" font-weight="600" font-size="15" fill="#2d3142">Phase 2 · k3s</text><text x="1560.0" y="1171" text-anchor="middle" font-family="DejaVu Sans Mono" font-size="9.5" fill="#5a6580">several nodes, replicas, HPA</text><text x="1560.0" y="1184" text-anchor="middle" font-family="DejaVu Sans Mono" font-size="9.5" fill="#5a6580">demo day or when API-bound</text><text x="90" y="380" font-family="Fira Sans" font-size="14" fill="#2d3142">Committed data lives in PostgreSQL and S3; every write is transactional and idempotent, so a restart never loses accepted work.</text><text x="90" y="408" font-family="Fira Sans" font-size="14" fill="#2d3142">Prove it with drills: kill each container, stop PostgreSQL, restore from backup, and record time to recovery.</text><text x="90" y="440" font-family="DejaVu Sans Mono" font-size="10" fill="#5a6580">One host is not high availability: a host or region failure is recovered, not hidden.</text><text x="90" y="705" font-family="Fira Sans" font-size="13" fill="#2d3142">The oldest of three is removed only after the new dump is verified; an offsite download and a restore drill back this up.</text><text x="90" y="975" font-family="Fira Sans" font-size="13" fill="#2d3142">Migrations are expand-then-contract so the old image still runs; restore the pre-deploy dump only if data was changed incompatibly.</text><line x1="40" y1="1284" x2="1860" y2="1284" stroke="#2d3142" stroke-opacity="0.25"/><line x1="40" y1="1310" x2="74" y2="1310" stroke="#4f5d75" stroke-width="1.6"/><text x="84" y="1314" font-family="DejaVu Sans Mono" font-size="10" fill="#5a6580">next step</text><line x1="172.9" y1="1310" x2="206.9" y2="1310" stroke="#bf4520" stroke-width="1.6" stroke-dasharray="5 4"/><text x="216.9" y="1314" font-family="DejaVu Sans Mono" font-size="10" fill="#5a6580">failure path</text><rect x="324.1" y="1302" width="34" height="16" rx="3" fill="#f1ddd6" stroke="#bf4520" stroke-width="1.6"/><text x="368.1" y="1314" font-family="DejaVu Sans Mono" font-size="10" fill="#5a6580">key safeguard / later phase</text></svg>