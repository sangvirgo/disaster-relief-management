<text x="600" y="990" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#334155" stroke="white" stroke-width="5" paint-order="stroke">Permission requires role + current grant + object scope. Warehouse staff execute approved supply actions.</text>
<text x="600" y="1020" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#334155" stroke="white" stroke-width="5" paint-order="stroke">Campaign management is separate from intake. Admin permissions do not grant victim details.</text>
<text x="600" y="1050" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#334155" stroke="white" stroke-width="5" paint-order="stroke">Support view complements response and in-kind donation diagrams; advanced warehouse scope deferred.</text>
