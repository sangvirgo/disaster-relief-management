<path d="M1113,819 L1190,819 L1190,629 L1113,629" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#generalization)"/>
<g fill="none" stroke="#334155" stroke-width="2"><circle cx="110.0" cy="194" r="11"/><path d="M110.0,205 V239 M87.0,219 H133.0 M110.0,239 L88.0,265 M110.0,239 L132.0,265"/></g>
<text x="110.0" y="285" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#0f172a">Công dân / người báo tin</text>
<g fill="none" stroke="#334155" stroke-width="2"><circle cx="110.0" cy="379" r="11"/><path d="M110.0,390 V424 M87.0,404 H133.0 M110.0,424 L88.0,450 M110.0,424 L132.0,450"/></g>
<text x="110.0" y="470" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#0f172a">Công dân đã đăng nhập</text>
<g fill="none" stroke="#334155" stroke-width="2"><circle cx="1090.0" cy="204" r="11"/><path d="M1090.0,215 V249 M1067.0,229 H1113.0 M1090.0,249 L1068.0,275 M1090.0,249 L1112.0,275"/></g>
<text x="1090.0" y="295" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#0f172a">Điều phối viên</text>
<g fill="none" stroke="#334155" stroke-width="2"><circle cx="1090.0" cy="604" r="11"/><path d="M1090.0,615 V649 M1067.0,629 H1113.0 M1090.0,649 L1068.0,675 M1090.0,649 L1112.0,675"/></g>
<text x="1090.0" y="695" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#0f172a">Thành viên đội cứu hộ</text>
<g fill="none" stroke="#334155" stroke-width="2"><circle cx="1090.0" cy="794" r="11"/><path d="M1090.0,805 V839 M1067.0,819 H1113.0 M1090.0,839 L1068.0,865 M1090.0,839 L1112.0,865"/></g>
<text x="1090.0" y="885" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#0f172a">Đội trưởng</text>
<g fill="none" stroke="#334155" stroke-width="2"><circle cx="110.0" cy="784" r="11"/><path d="M110.0,795 V829 M87.0,809 H133.0 M110.0,829 L88.0,855 M110.0,829 L132.0,855"/></g>
<text x="110.0" y="875" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#0f172a">Quản lý vận hành</text>
<ellipse cx="425.0" cy="225.0" rx="125.0" ry="45.0" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
<text x="425.0" y="225.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#0f172a">Gửi yêu cầu cứu trợ</text>
<ellipse cx="425.0" cy="415.0" rx="125.0" ry="45.0" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
<text x="425.0" y="415.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#0f172a">Báo giúp hộ gia đình từ xa</text>
<ellipse cx="775.0" cy="225.0" rx="125.0" ry="45.0" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
<text x="775.0" y="225.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#0f172a">Xác minh và phân loại yêu cầu</text>
<ellipse cx="775.0" cy="415.0" rx="125.0" ry="45.0" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
<text x="775.0" y="415.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#0f172a">Phân công / tiếp nhận nhiệm vụ</text>
<ellipse cx="425.0" cy="645.0" rx="125.0" ry="45.0" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
<text x="425.0" y="645.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#0f172a">Xem bản đồ nhiệt và hàng đợi</text>
<ellipse cx="425.0" cy="845.0" rx="125.0" ry="45.0" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
<text x="425.0" y="845.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#0f172a">Xem báo cáo theo phạm vi</text>
<ellipse cx="775.0" cy="645.0" rx="125.0" ry="45.0" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
<text x="775.0" y="645.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#0f172a">Xem nhiệm vụ được giao</text>
<path d="M1010,850 L900,850" fill="none" stroke="#475569" stroke-width="1.5"/>
<path d="M1067,229 L970,229 L970,872 L880,872" fill="none" stroke="#475569" stroke-width="1.5"/>
<ellipse cx="775.0" cy="845.0" rx="125.0" ry="45.0" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
<text x="775.0" y="845.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#0f172a">Quản lý đội / vị trí</text>
<text x="600" y="1010" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#334155" stroke="white" stroke-width="5" paint-order="stroke">Gửi yêu cầu cứu trợ là luồng chung; báo giúp từ xa cần công dân đã đăng nhập.</text>
<text x="600" y="1100" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#334155" stroke="white" stroke-width="5" paint-order="stroke">Đội trưởng quản lý đội của mình; điều phối viên có thể ghi tiến độ/vị trí thay đội chưa dùng ứng dụng (có lưu vết).</text>
<text x="600" y="1040" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#334155" stroke="white" stroke-width="5" paint-order="stroke">Thành viên đội chỉ được xem nhiệm vụ; thay đổi cần điều phối viên hoặc đội trưởng đang hoạt động.</text>
<text x="600" y="1070" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#334155" stroke="white" stroke-width="5" paint-order="stroke">Loại hình tình nguyện viên, quân đội hoặc chính quyền không làm thay đổi quyền xử lý nhiệm vụ.</text>
</svg>
