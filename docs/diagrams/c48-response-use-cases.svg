<text x="600" y="1010" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#334155" stroke="white" stroke-width="5" paint-order="stroke">UC-01 is common SOS intake; UC-15 adds the signed-in remote-report workflow.</text>
<text x="600" y="1040" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#334155" stroke="white" stroke-width="5" paint-order="stroke">UC-17 permits reading only. UC-03 mutations require coordinator or active leader.</text>
<text x="600" y="1070" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#334155" stroke="white" stroke-width="5" paint-order="stroke">Volunteer, military and government affiliation does not change mission permissions.</text>
